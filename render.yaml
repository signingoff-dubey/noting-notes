services:
  - type: web
    name: noting-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: data
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
